# Docker Compose for the full RaceDay Application stack (SQL Server + API + MVC)

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=RaceDay@123
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: RaceDayAPI/Dockerfile
    container_name: raceday-api
    ports:
      - "5201:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=RaceDayDB;User Id=sa;Password=RaceDay@123;TrustServerCertificate=True;MultipleActiveResultSets=true
      - ConnectionStrings__AzureStorage=DefaultEndpointsProtocol=https;AccountName=youraccount;AccountKey=yourkey;EndpointSuffix=core.windows.net
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: RaceDayWeb/Dockerfile
    container_name: raceday-web
    ports:
      - "5202:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ApiBaseUrl=http://api:80
    depends_on:
      - api

volumes:
  sqlserver-data:

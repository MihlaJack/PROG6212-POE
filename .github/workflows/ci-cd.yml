name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build --configuration Release --no-restore

    - name: Run unit tests
      run: dotnet test --configuration Release --no-build --verbosity normal

    - name: Publish API build artifacts
      if: success()
      run: dotnet publish RaceDayAPI/RaceDayAPI/RaceDayAPI.csproj --configuration Release --output ./publish-api

    - name: Publish MVC build artifacts
      if: success()
      run: dotnet publish RaceDayAPI/RaceDayWeb/RaceDayWeb.csproj --configuration Release --output ./publish-web
